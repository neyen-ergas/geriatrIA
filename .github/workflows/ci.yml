name: CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: prueba-sin-credenciales

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Production HTTP smoke test
        run: node scripts/probar-acceso-produccion.mjs

  database-tests:
    name: Database tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start local database and apply migrations
        run: npx supabase db start

      - name: Generate database types
        run: npm run db:types:local

      - name: Show generated database type changes
        run: git diff -- src/types/database.ts

      - name: Database tests
        run: npm run test:db

      - name: Concurrent resident writes
        run: npm run test:db:concurrency

      - name: Concurrent payments
        run: python3 scripts/probar-concurrencia-pagos.py

      - name: Concurrent consultation conversion
        run: python3 scripts/probar-concurrencia-conversion.py

      - name: Concurrent employee changes
        run: python3 scripts/probar-concurrencia-empleados.py

      - name: Concurrent access changes
        run: python3 scripts/probar-concurrencia-accesos.py

      - name: Concurrent employee account changes
        run: python3 scripts/probar-concurrencia-cuentas-empleados.py

      - name: Audit historical migration
        run: python3 scripts/probar-importacion-auditoria.py

      - name: Concurrent family contact edits
        run: python3 scripts/probar-concurrencia-familiares.py

      - name: Concurrent resident records
        run: python3 scripts/probar-concurrencia-registros.py

      - name: Concurrent interview changes
        run: python3 scripts/probar-concurrencia-entrevistas.py

      - name: Concurrent shift reservations
        run: python3 scripts/probar-concurrencia-turnos.py

      - name: Concurrent retries and employee termination
        run: python3 scripts/probar-concurrencia-reintentos-bajas.py

      - name: Stop local database
        if: always()
        run: npx supabase stop
