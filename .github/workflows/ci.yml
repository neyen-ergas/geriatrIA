name: CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

  database-tests:
    name: Database tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start local database and apply migrations
        run: npx supabase db start

      - name: Generate database types
        run: npm run db:types:local

      - name: Save generated database types
        uses: actions/upload-artifact@v4
        with:
          name: database-types
          path: src/types/database.ts
          retention-days: 3

      - name: Database tests
        run: npm run test:db

      - name: Concurrent resident writes
        run: npm run test:db:concurrency

      - name: Stop local database
        if: always()
        run: npx supabase stop
